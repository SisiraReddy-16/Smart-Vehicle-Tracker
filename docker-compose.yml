services:
  app:
    image: ${APP_IMAGE}
    container_name: smart-vehicle-tracker
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    expose:
      - "8080"      # only reachable by other containers on this compose network, NOT the internet
 
  nginx:
    image: nginx:1.27-alpine
    container_name: svt-nginx
    restart: unless-stopped
    ports:
      - "80:80"     # this is the only port exposed to the outside world now
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app