server {
    listen 80;
    server_name _;   # replace with your DuckDNS/domain name once you have it, e.g. smart-vehicle-tracker.duckdns.org
 
    # so http://yourdomain/ takes people straight into the app
    location = / {
        return 302 /smart-vehicle-tracker/;
    }
 
    location /smart-vehicle-tracker/ {
        proxy_pass         http://app:8080/smart-vehicle-tracker/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
 
        # WebSocket-safe headers - harmless even if you don't use websockets, cheap to have
        proxy_http_version 1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }
}